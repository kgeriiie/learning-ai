[project]
name = "ai-engineer-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "crewai>=1.15.22",
    "datasets>=5.0.0",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "litellm>=1.96.0",
    "matplotlib>=3.11.1",
    "openai-whisper>=20250625",
    "pypdf>=6.16.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.14",
    "tools>=1.0.35",
    "torch",
    "transformers<5",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
